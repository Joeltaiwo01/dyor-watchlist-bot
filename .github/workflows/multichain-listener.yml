name: Multichain Instant Listener

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests websockets web3

      - name: Run multichain listener
        env:
          ETHEREUM_EXPLORER_API_KEY: ${{ secrets.ETHEREUM_EXPLORER_API_KEY }}
          BASE_EXPLORER_API_KEY: ${{ secrets.BASE_EXPLORER_API_KEY }}
          BSC_EXPLORER_API_KEY: ${{ secrets.BSC_EXPLORER_API_KEY }}
        run: python multichain_listener.py

      - name: Save updated tracking data
        run: |
          git config user.name "instant-listener-bot"
          git config user.email "instant-listener-bot@users.noreply.github.com"
          git add data/seen_scam_bytecode.json data/instant_alerts_log.json
          git diff --quiet --cached || git commit -m "Update tracking data [automated]"
          git pull --rebase origin main
          git push
