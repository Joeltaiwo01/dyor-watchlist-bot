name: DYOR Watchlist Bot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run DYOR bot
        run: python scripts/main.py

      - name: Save updated watchlist back to the repo
        run: |
          git config user.name "dyor-bot"
          git config user.email "dyor-bot@users.noreply.github.com"
          git add data/watchlist.json
          git diff --quiet --cached || git commit -m "Update watchlist [automated]"
          git push
